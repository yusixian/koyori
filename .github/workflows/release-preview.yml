name: Release preview

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Preview distribution method
        required: true
        default: manual
        type: choice
        options:
          - manual
          - development-signed
          - signed

permissions: {}

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and accept candidate
    runs-on: macos-15
    timeout-minutes: 80
    environment: preview-release
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      notes: ${{ steps.prepare.outputs.notes }}
      distribution: ${{ inputs.distribution }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted main commit and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          test "$main_sha" = "$GITHUB_SHA"
          successful_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length')
          test "$successful_runs" -gt 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron distribution
        run: node scripts/prepare-desktop.mjs

      - name: Test release validation helper
        run: node --test scripts/release-preview.test.mjs

      - name: Prepare release identity
        id: prepare
        run: >-
          node scripts/release-preview.mjs prepare
          --root .
          --commit "$GITHUB_SHA"
          --output "$GITHUB_OUTPUT"

      - name: Check first-release identity before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-preview.mjs inspect-remote \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

      - name: Build signed and notarized candidate
        if: inputs.distribution == 'signed'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/koyori-notary-key.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          node -e 'const fs = require("node:fs"); const value = process.env.APPLE_API_KEY_P8; if (!value) throw new Error("APPLE_API_KEY_P8 is missing."); fs.writeFileSync(process.env.APPLE_API_KEY, value, { mode: 0o600 });'
          unset APPLE_API_KEY_P8
          KOYORI_SIGNED_RELEASE=1 pnpm package:mac

      - name: Build unsigned manual-install candidate
        if: inputs.distribution == 'manual'
        run: KOYORI_MANUAL_PREVIEW=1 pnpm package:mac

      - name: Build Apple Development-signed manual-install candidate
        if: inputs.distribution == 'development-signed'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: KOYORI_DEVELOPMENT_SIGNED_PREVIEW=1 pnpm package:mac

      - name: Accept applications from both public archives
        run: |
          set -euo pipefail
          node scripts/accept-preview-archives.mjs \
            --candidate artifacts/candidate.json \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/koyori-archive-tests.json"
          node scripts/release-preview.mjs record-acceptance \
            --root . \
            --commit "$GITHUB_SHA" \
            --candidate artifacts/candidate.json \
            --archiveTests "$RUNNER_TEMP/koyori-archive-tests.json" \
            --output artifacts/acceptance.json

      - name: Upload the accepted candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: koyori-preview-${{ steps.prepare.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/candidate.json
            artifacts/acceptance.json
            artifacts/Koyori-${{ steps.prepare.outputs.version }}-arm64.dmg
            artifacts/Koyori-${{ steps.prepare.outputs.version }}-arm64.dmg.blockmap
            artifacts/Koyori-${{ steps.prepare.outputs.version }}-arm64.zip
            artifacts/Koyori-${{ steps.prepare.outputs.version }}-arm64.zip.blockmap
            artifacts/alpha-mac.yml

  publish:
    name: Verify and publish accepted candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the accepted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the accepted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: koyori-preview-${{ needs.build.outputs.version }}
          path: release-input

      - name: Verify publish input
        id: verify
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          node scripts/release-preview.mjs verify-publish
          --root .
          --directory release-input
          --commit "$GITHUB_SHA"
          --version "$RELEASE_VERSION"
          --output "$GITHUB_OUTPUT"

      - name: Inspect remote Release and compare existing asset bytes
        id: initial_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-preview.mjs inspect-remote \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --local release-input \
            --remote remote-assets-initial --plan release-plan-initial.json \
            --output "$GITHUB_OUTPUT"

      - name: Create draft prerelease
        if: steps.initial_state.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_NOTES: ${{ steps.verify.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --title "Koyori $RELEASE_TAG Preview" \
            --notes-file "$RELEASE_NOTES"

      - name: Reinspect draft before any upload
        id: draft_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-preview.mjs inspect-remote \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --local release-input \
            --remote remote-assets-draft --plan release-plan-draft.json \
            --output "$GITHUB_OUTPUT"

      - name: Upload only missing accepted assets
        if: steps.draft_state.outputs.action == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t missing < <(jq -r '.missing[]' release-plan-draft.json)
          assets=()
          for file in "${missing[@]}"; do
            assets+=("release-input/$file")
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}"

      - name: Verify complete remote asset set before publishing
        id: complete_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-preview.mjs inspect-remote \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --local release-input \
            --remote remote-assets-complete --plan release-plan-complete.json \
            --output "$GITHUB_OUTPUT"
          action=$(jq -r '.action' release-plan-complete.json)
          test "$action" = "publish" || test "$action" = "published"

      - name: Publish the verified prerelease
        if: steps.complete_state.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=true

      - name: Confirm published commit and generate catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-preview.mjs inspect-remote \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --local release-input \
            --remote remote-assets-published --plan release-plan-published.json
          test "$(jq -r '.action' release-plan-published.json)" = "published"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == true')" = "true"
          release_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          test "$release_commit" = "$GITHUB_SHA"
          published_at=$(gh release view "$RELEASE_TAG" --json publishedAt --jq '.publishedAt')
          node scripts/release-preview.mjs catalog \
            --candidate release-input/candidate.json \
            --publishedAt "$published_at" \
            --output release-output/preview-mac-arm64.json

      - name: Upload website catalog for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: koyori-preview-catalog-${{ steps.verify.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: release-output/preview-mac-arm64.json
