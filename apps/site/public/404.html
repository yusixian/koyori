<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · Koyori</title>
    <style>
      :root { color-scheme: light; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; color: #332b2e; background: #fffaf8; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 80% 15%, #dff5e9 0 9rem, transparent 9.1rem), linear-gradient(135deg, #fffaf8, #fff3f4); }
      main { width: min(38rem, calc(100% - 3rem)); }
      .code { margin: 0 0 -1rem; color: #f2c5cc; font: 700 clamp(7rem, 25vw, 13rem)/1 Georgia, serif; }
      h1 { font-size: clamp(2rem, 7vw, 3.75rem); line-height: 1.1; margin: 0 0 1rem; }
      p { color: #6f6266; line-height: 1.8; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; color: white; background: #b9576c; border-radius: 999px; text-decoration: none; }
      a:focus-visible { outline: 3px solid #78b99a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>这根线没有连到页面。</h1>
      <p>地址可能写错了，或者内容还没有公开。</p>
      <a href="/">返回 Koyori 首页</a>
    </main>
  </body>
</html>
